# Short bio for the home page (Markdown links allowed: [text](url)).
bio:
  - >-
    I am a PhD student at [EPFL](https://www.epfl.ch) in the
    [Computer Vision Laboratory](https://www.epfl.ch/labs/cvlab/), advised by
    [Prof. Pascal Fua](https://people.epfl.ch/pascal.fua), and supported by an
    EDIC Fellowship. My research focuses on optimizing 3D shapes within the latent
    spaces of large generative models, keeping them valid while
    pushing them towards engineering objectives such as aerodynamic drag or stiffness.
  - >-
    Before my PhD, I obtained an M.Sc. in Computational Science and Engineering from EPFL,
    and wrote my Master's thesis at [Harvard University](https://iacs.seas.harvard.edu/)
    with [Prof. Pavlos Protopapas](https://pll.harvard.edu/instructor/pavlos-protopapas)
    on physics-informed neural networks for stiff differential equations. I have also worked
    on deep learning for ophthalmology at the Jules-Gonin Eye Hospital and as a data engineer
    at Liom.

interests:
  - 3D generative models
  - Shape optimization
  - Flow matching & diffusion
  - Scientific machine learning

