# Weekly pull requests to update pinned dependencies (security fixes included).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /scripts
    schedule: { interval: weekly }
    ignore:
      - dependency-name: bibtexparser   # scholarly needs bibtexparser 1.x
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
